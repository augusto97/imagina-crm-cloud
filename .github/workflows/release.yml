name: Release

# Empaqueta un bundle autocontenido (API compilado + node_modules de prod +
# SPA build + migraciones + scripts) y lo publica como asset de un GitHub
# Release, con su .sha256. La app lo detecta y lo instala sola (ADR-S13).
#
# Se dispara: (a) al mergear a main → publica la versión de ./VERSION si NO
# existe todavía (así un commit común no re-releasa); (b) al taggear vX.Y.Z;
# (c) a mano por workflow_dispatch con un input de versión.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release, ej. v1.2.0'
        required: true
        type: string
      captures:
        description: 'Capturas del centro de aprendizaje: sólo lo que cambió, todas de nuevo o ninguna'
        required: false
        default: cambios
        type: choice
        options: [cambios, todas, ninguna]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
      ref: ${{ steps.d.outputs.ref }}
      version: ${{ steps.d.outputs.version }}
      record: ${{ steps.plan.outputs.record || 'false' }}
      files: ${{ steps.plan.outputs.files }}
      shards: ${{ steps.plan.outputs.shards || '[1]' }}
      shard_total: ${{ steps.plan.outputs.shard_total || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Para comparar con la versión anterior (qué capturas cambiaron).
          fetch-depth: 0
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            REF="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            REF="${{ github.ref_name }}"
          else
            REF="v$(cat VERSION)"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          GO=true
          # En push a main sólo publicamos si esa versión aún no existe.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            if gh release view "${REF}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then GO=false; fi
          fi
          echo "go=${GO}" >> "$GITHUB_OUTPUT"
          echo "→ release ${REF} · publicar=${GO}"

      # v0.1.390 — Las capturas del centro de aprendizaje se REUTILIZAN: se
      # parte de las de la versión anterior (vienen dentro de su paquete, ~34 MB)
      # y se graba sólo el archivo de escenarios que cambió o la demo que falta
      # (scripts/help-captures/plan.mjs). Un cambio que no toca la ayuda publica
      # sin grabar nada. Todo de nuevo: el input «todas» o «[capturas]» en el
      # mensaje del commit. Para regrabar UN módulo, se toca su escenario.
      - uses: actions/setup-node@v4
        if: steps.d.outputs.go == 'true'
        with:
          node-version: 22

      - id: plan
        if: steps.d.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.d.outputs.ref }}
          MODE: ${{ github.event.inputs.captures || 'cambios' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -uo pipefail
          if [ "$MODE" = "ninguna" ]; then
            echo "record=false" >> "$GITHUB_OUTPUT"
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "shards=[1]" >> "$GITHUB_OUTPUT"
            echo "shard_total=1" >> "$GITHUB_OUTPUT"
          fi
          PREV=$(gh release list -R "$GITHUB_REPOSITORY" -L 20 --exclude-drafts --json tagName -q '.[].tagName' | grep -vx "$REF" | head -1 || true)
          ALL=""
          if [ "$MODE" = "todas" ] || printf '%s' "$COMMIT_MSG" | grep -qi '\[capturas\]'; then ALL="--all"; fi
          CHANGED=""
          if [ -n "$PREV" ]; then
            if gh release download "$PREV" -R "$GITHUB_REPOSITORY" -p "imagina-base-${PREV#v}.zip" -D prev-bundle; then
              unzip -q prev-bundle/*.zip 'web/help-media/*' -d prev-bundle || echo "::warning::El paquete de ${PREV} no trae capturas."
            else
              echo "::warning::No se pudo bajar el paquete de ${PREV}: se graban todas."
            fi
            CHANGED=$(git diff --name-only "$PREV" "$GITHUB_SHA" -- scripts/help-captures/scenarios/ 2>/dev/null | tr '\n' ',' || true)
            git rev-parse -q --verify "refs/tags/$PREV" >/dev/null || ALL="--all"
          fi
          echo "versión anterior: ${PREV:-(ninguna)} · escenarios cambiados: ${CHANGED:-(ninguno)}"
          if [ "$MODE" != "ninguna" ]; then
            node scripts/help-captures/plan.mjs --prev prev-bundle/web/help-media --changed "$CHANGED" $ALL --github-output "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.d.outputs.go == 'true'
        with:
          name: prev-help-media
          retention-days: 1
          if-no-files-found: ignore
          path: prev-bundle/web/help-media

  # v0.1.364 — La publicación va en tres pasos: compilar una vez, grabar las
  # capturas del centro de aprendizaje en 5 máquinas a la vez (eran ~17 min en
  # una sola) y juntar todo en el bundle. De ~20 a ~10 minutos.
  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (shared → api → web)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm --filter @imagina-base/shared build
          pnpm --filter @imagina-base/api build
          pnpm --filter @imagina-base/web build:cloud

      - uses: actions/upload-artifact@v4
        with:
          name: build
          retention-days: 1
          if-no-files-found: error
          path: |
            packages/shared/dist
            apps/api/dist
            apps/web/dist-cloud

  # v0.1.322 — capturas reales del centro de aprendizaje (ADR-S75): una copia
  # efímera de la app sobre una empresa de ejemplo graba cada demo. Cada
  # máquina graba su parte (scripts/help-captures/shard.mjs reparte por archivo
  # de escenarios según lo que tardó cada uno). Si una falla, el release sale
  # igual con lo que grabaron las demás: lo que falte se ve con su ilustración.
  captures:
    needs: [gate, build]
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.record == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # v0.1.390 — tantas máquinas como haga falta para lo que hay que grabar (1 a 5).
        shard: ${{ fromJSON(needs.gate.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: build

      - name: Capturas (parte ${{ matrix.shard }} de ${{ needs.gate.outputs.shard_total }})
        env:
          HC_SHARD: ${{ matrix.shard }}/${{ needs.gate.outputs.shard_total }}
          HC_FILES: ${{ needs.gate.outputs.files }}
        run: |
          bash scripts/help-captures/ci.sh help-media || {
            echo "::warning::La parte ${{ matrix.shard }} de las capturas falló; el release sale sin ellas (esa ayuda se ve con sus ilustraciones)."
          }
          rm -f help-media/fallo-*.png help-media/demos.json

      - uses: actions/upload-artifact@v4
        with:
          name: help-media-${{ matrix.shard }}
          retention-days: 1
          if-no-files-found: ignore
          path: help-media

  publish:
    needs: [gate, build, captures]
    # Sale aunque alguna parte de las capturas falle (son un extra).
    if: always() && needs.gate.outputs.go == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: build

      # v0.1.390 — Base: las capturas de la versión anterior; encima, lo que se
      # grabó ahora (cada demo grabada reemplaza entera a la anterior).
      - name: Capturas de la versión anterior
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: prev-help-media
          path: apps/web/dist-cloud/help-media

      - name: Capturas grabadas ahora
        # Si no se grabó nada (o falló), la versión sale con las anteriores.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: help-media-*
          merge-multiple: true
          path: fresh-help-media

      - name: Juntar las capturas
        run: node scripts/help-captures/merge.mjs apps/web/dist-cloud/help-media fresh-help-media

      - name: Armar bundle autocontenido
        env:
          # v0.1.335: la misma clave firma el complemento de WordPress (si está).
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.gate.outputs.version }}"
          OUT=bundle
          rm -rf "$OUT" dist-release && mkdir -p "$OUT/apps" "$OUT/deploy" dist-release

          # node_modules de producción COMPLETO y autocontenido. Usamos el deploy
          # no-legacy con inject-workspace-packages (resuelve @imagina-base/shared
          # y TODAS las deps transitivas, ej. fastify-plugin). El --legacy dejaba
          # el árbol incompleto.
          pnpm --filter @imagina-base/api deploy --prod --config.inject-workspace-packages=true "$OUT/apps/api"
          # el build (dist) está gitignored → pnpm deploy no lo copia; lo agregamos
          cp -r apps/api/dist "$OUT/apps/api/dist"
          # v0.1.272 — las tipografías que el PDF embebe (ADR-S37).
          [ -d "$OUT/apps/api/assets/fonts" ] || cp -r apps/api/assets "$OUT/apps/api/assets"

          # SPA (cloud + portal + assets)
          cp -r apps/web/dist-cloud "$OUT/web"

          # v0.1.334 (ADR-S84) — el complemento de WordPress viaja con el API:
          # cada servidor arma el zip al descargarlo (con SU dirección, para que
          # el complemento se actualice desde ahí). Se revisa que no tenga
          # errores de PHP y que se pueda empaquetar antes de publicar.
          if command -v php >/dev/null; then
            find integrations/wordpress-plugin -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          fi
          mkdir -p "$OUT/integrations"
          cp -r integrations/wordpress-plugin "$OUT/integrations/wordpress-plugin"
          # v0.1.335 — firma del complemento (manifiesto + Ed25519 + clave pública):
          # cada sitio verifica la próxima actualización antes de instalarla.
          sh scripts/sign-wordpress-plugin.sh "$OUT/integrations/wordpress-plugin/imagina-base-connector"
          ( cd "$OUT/integrations/wordpress-plugin" && zip -qr "../../../dist-release/check-plugin.zip" imagina-base-connector )
          unzip -l dist-release/check-plugin.zip | grep -q 'imagina-base-connector/imagina-base-connector.php'
          # Se borra: un segundo .zip en el release confundiría al actualizador de
          # los servidores que todavía eligen «el primer .zip» (antes de v0.1.334).
          rm -f dist-release/check-plugin.zip

          # v0.1.443 (G2) — la app de n8n: se compila, se prueba y viaja
          # empaquetada (`npm pack`). Cada servidor la reparte en
          # /api/v1/public/n8n/n8n-nodes-imagina-base.tgz, así un n8n propio la
          # instala sin depender de npm; también queda como asset del release.
          ( cd integrations/n8n && npm ci --no-audit --no-fund && npm run build && npm test && npm pack --pack-destination . >/dev/null )
          mkdir -p "$OUT/integrations/n8n"
          cp integrations/n8n/package.json "$OUT/integrations/n8n/package.json"
          N8N_TGZ=$(ls integrations/n8n/n8n-nodes-imagina-base-*.tgz | head -1)
          tar -tzf "$N8N_TGZ" | grep -q 'package/dist/nodes/ImaginaBase/ImaginaBase.node.js'
          tar -tzf "$N8N_TGZ" | grep -q 'package/dist/nodes/ImaginaBaseTrigger/ImaginaBaseTrigger.node.js'
          cp "$N8N_TGZ" "$OUT/integrations/n8n/n8n-nodes-imagina-base.tgz"
          cp "$N8N_TGZ" dist-release/

          # scripts + config que el release necesita para instalar/rollback/servir
          cp deploy/deploy.sh deploy/finalize.sh deploy/oauth-discovery-static.sh deploy/env-heal.sh "$OUT/deploy/"
          cp scripts/backup.sh scripts/restore.sh "$OUT/deploy/"
          # v0.1.179 — copias completas + migración de servidor (ADR-S20)
          cp scripts/snapshot.sh scripts/snapshot-restore.sh scripts/snapshot-verify.sh scripts/bootstrap-server.sh scripts/redis-kv.mjs "$OUT/deploy/"
          cp deploy/docker-compose.prod.yml deploy/.env.production.example \
             deploy/nginx.conf deploy/imagina-api.service "$OUT/deploy/"
          # v0.1.283 — servidor nuevo en un comando + recuperación desde el Drive (ADR-S43)
          cp deploy/install.sh deploy/recover-from-snapshot.sh deploy/snapshot-env-filter.sh deploy/Caddyfile deploy/serveravatar-nginx.sh deploy/install-guardian.sh "$OUT/deploy/"
          # v0.1.431 — el guardián del servidor (ADR-S104): lo instala root una vez.
          mkdir -p "$OUT/deploy/guardian" && cp deploy/guardian/* "$OUT/deploy/guardian/"
          chmod +x "$OUT/deploy/guardian/imagina-guardian.sh" "$OUT/deploy/guardian/imagina-estado" "$OUT/deploy/guardian/imagina-reparar" "$OUT/deploy/guardian/imagina-rescate"
          chmod +x "$OUT"/deploy/*.sh
          # install.sh también va suelto en el release: es lo que se baja con
          #   curl -fsSL https://github.com/<repo>/releases/latest/download/install.sh | sudo bash
          cp deploy/install.sh dist-release/install.sh

          # versión exacta que reportará el server
          echo "$VERSION" > "$OUT/VERSION"

          # zip -y: preserva los symlinks del store .pnpm (son relativos), si no
          # el node_modules se rompe al extraer.
          ZIP="dist-release/imagina-base-${VERSION}.zip"
          ( cd "$OUT" && zip -qry "../$ZIP" . )
          sha256sum "$ZIP" | awk '{print $1}' > "${ZIP}.sha256"
          ls -lh dist-release

      # SEC-37 (v0.1.239): firma DETACHED ed25519 del bundle (opt-in). El
      # `.sha256` sólo detecta corrupción: quien pueda alterar el release
      # también trae un checksum que coincide. Con el secreto
      # RELEASE_SIGNING_KEY (clave privada PEM ed25519) se publica `.zip.sig`,
      # y un servidor con UPDATER_PUBLIC_KEY se niega a instalar un bundle sin
      # firma válida (verify-signature.ts). Sin el secreto, el paso no hace nada.
      - name: Firmar el bundle (si hay clave)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "${RELEASE_SIGNING_KEY}" ]; then echo "sin RELEASE_SIGNING_KEY: release sin firma"; exit 0; fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > /tmp/release-signing.pem
          for ZIP in dist-release/*.zip; do
            openssl pkeyutl -sign -inkey /tmp/release-signing.pem -rawin -in "$ZIP" -out "${ZIP}.sig"
          done
          rm -f /tmp/release-signing.pem
          ls -l dist-release/*.sig

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.ref }}
          files: |
            dist-release/*.zip
            dist-release/*.zip.sha256
            dist-release/*.zip.sig
            dist-release/install.sh
            dist-release/*.tgz

      # v0.1.443 — la app de n8n también en npm, si hay NPM_TOKEN (así se
      # instala desde n8n → Ajustes → Community nodes). Una versión ya
      # publicada no se vuelve a publicar (npm lo rechazaría).
      - name: Publicar la app de n8n en npm (si hay NPM_TOKEN)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then echo "sin NPM_TOKEN: la app de n8n no se publica en npm"; exit 0; fi
          cd integrations/n8n
          V=$(node -p "require('./package.json').version")
          if npm view "n8n-nodes-imagina-base@${V}" version >/dev/null 2>&1; then echo "n8n-nodes-imagina-base@${V} ya está en npm"; exit 0; fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          npm publish --access public
          rm -f .npmrc
