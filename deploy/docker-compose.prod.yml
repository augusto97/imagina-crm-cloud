# Servicios de datos de producción — Postgres 16 + Redis 7.
# El API corre nativo (systemd, ver deploy/imagina-api.service); aquí van sólo
# los stores con estado, con volúmenes persistentes y credenciales por env.
#
# Uso:  docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d
name: imagina-base-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # PITR (STANDALONE §14/§17): archivado continuo de WAL. Cada segmento se
    # copia al volumen `walarchive` (separado de pgdata → sobrevive a su
    # pérdida). Con un base backup físico (scripts/basebackup.sh) + estos WAL se
    # restaura a CUALQUIER instante, no sólo al último dump lógico.
    # `archive_timeout=300` fuerza el archivado aunque haya poca escritura (acota
    # el RPO a ≤5 min). El `archive_command` es idempotente (no pisa segmentos).
    # OJO: cada segmento pesa 16 MB aunque esté casi vacío — con archivado cada
    # 5 min son hasta ~4,5 GB por día; por eso el comando comprime y poda.
    #
    # v0.1.337 — `/wal_archive` es un volumen NOMBRADO montado en una ruta que
    # la imagen no trae, así que Docker la crea `root:root 755` y Postgres
    # (uid 70) no puede escribir: el archivado fallaba SIEMPRE y Postgres
    # guardaba todo el WAL en pg_wal hasta llenar el disco (pasó en producción:
    # 45 GB en 20 días). El entrypoint le da la carpeta a postgres antes de
    # arrancar (el entrypoint oficial corre como root y después baja a postgres).
    entrypoint:
      - sh
      - -c
      - 'mkdir -p /wal_archive; chown postgres:postgres /wal_archive || true; exec docker-entrypoint.sh "$$@"'
      - --
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      # v0.1.278 — además poda el archivo: los segmentos de más de 3 días se
      # borran solos (antes nada lo podaba y llenó un disco). Con un base
      # backup diario (scripts/basebackup.sh) eso alcanza para restaurar a
      # cualquier momento de los últimos 3 días. Cambiar a mano los minutos
      # (4320) si se quiere otra ventana.
      # v0.1.337 — (a) COMPRIMIDO: un segmento que cierra `archive_timeout` es
      # casi todo ceros, 16 MB → unos KB en gzip; (b) ATÓMICO: se escribe a
      # `.tmp` y se renombra, así un corte (disco lleno) no deja un archivo a
      # medias; (c) IDEMPOTENTE: si el segmento ya está archivado (Postgres lo
      # reintenta tras un corte entre copiar y marcarlo), responde éxito. El
      # comando viejo (`test ! -f … && cp …`) fallaba PARA SIEMPRE en esos dos
      # casos → mismo efecto: pg_wal crece sin límite. `$$` = `$` para compose.
      - 'archive_command=f=/wal_archive/%f; [ -f "$$f.gz" ] || [ -f "$$f" ] || { gzip -c %p > "$$f.gz.tmp" && mv -f "$$f.gz.tmp" "$$f.gz"; } && { find /wal_archive -type f -mmin +4320 -delete || true; }'
      - -c
      - archive_timeout=300
      - -c
      - max_wal_senders=3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.production}
    ports:
      # Sólo localhost: el API nativo se conecta por 127.0.0.1; NO exponer a la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set in .env.production}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  # Archivo de WAL para PITR (separado de pgdata a propósito). Sincronizarlo
  # off-site junto con los base backups — ver docs/runbook-pitr.md.
  walarchive:
